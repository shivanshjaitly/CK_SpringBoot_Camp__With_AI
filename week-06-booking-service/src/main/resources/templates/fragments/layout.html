<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:fragment="head">
<meta charset="UTF-8">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #8884; }
  nav a { text-decoration: none; font-weight: 600; }
  nav .spacer { flex: 1; }
  nav .who { opacity: 0.7; font-size: 0.9rem; }
  .card { border: 1px solid #8884; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card h3 { margin: 0 0 0.4rem; }
  .meta { opacity: 0.7; font-size: 0.9rem; margin: 0.15rem 0; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .badge.OPEN, .badge.CONFIRMED, .badge.BookingConfirmed { background: #1a7f371a; color: #1a7f37; }
  .badge.FULL, .badge.CANCELLED, .badge.BookingCancelled { background: #cf222e1a; color: #cf222e; }
  form.inline { display: inline; margin-top: 0.5rem; }
  input, textarea, button { font: inherit; }
  input[type=text], input[type=email], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; margin: 0.3rem 0 0.7rem; border-radius: 6px; border: 1px solid #8888; }
  button { padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #1a7f37; color: white; cursor: pointer; }
  button.danger { background: #cf222e; }
  .banner { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .banner.ok { background: #1a7f371a; color: #1a7f37; }
  .banner.err { background: #cf222e1a; color: #cf222e; }
</style>
</th:block>
</head>
<body>
<nav th:fragment="nav">
  <a th:href="@{/ui/dashboard}">Slots</a>
  <a th:href="@{/ui/bookings/mine}" sec:authorize="hasRole('CUSTOMER')">My Bookings</a>
  <span class="spacer"></span>
  <span class="who" sec:authentication="name">user</span>
  <form th:action="@{/ui/logout}" method="post" class="inline">
    <button type="submit">Logout</button>
  </form>
</nav>
</body>
</html>
