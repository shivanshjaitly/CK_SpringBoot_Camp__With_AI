server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notificationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # Ignore any producer type header and always deserialize into OUR local
        # BookingEvent — the two services agree on JSON shape, not a shared class.
        spring.json.use.type.headers: false
        spring.json.value.default.type: in.codekerdos.notification.event.BookingEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
